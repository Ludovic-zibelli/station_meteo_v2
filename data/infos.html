<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="/images/logo_meteo.png" />
  <link rel="stylesheet" href="/style.css" />
  <title>Station METEOSPIT.fr ESP32|Informations</title>
  <!-- Bootstrap CSS depuis un CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<container-fluid>
        <header>
                <nav class="nav_dek navbar fixed-top navbar-expand-lg  navbar-dark bg-dark">
            
                    <a class="navbar-brand" href="{{ path('home') }}">
                        <img src="images/logo_meteo_head6.png" width="260" height="100" class="logo_site align-left rounded float-left" alt="Station Meteo">
                    </a>
                    <div class="collapse navbar-collapse" id="navbarText">
                        <ul class="navbar-nav ml-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="/">Accueil</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/config">Configuration</a>
                            </li>
                            <li class="nav-item">
                            <a class="nav-link" href="/infos">Info compte Meteospit.fr</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/update">Mise a jour</a>
                            </li>
                        </ul>
                    </div>

                </nav>
        </header> 
        <body class="bg-light">
            <div class="row">
                <div class="container mt-5 pt-5">
                    <h1 id="stationVille">Chargement...</h1>
                    <p><strong>Code postal:</strong> <span id="stationCP">-</span></p>
                    <p id="stationDesc">-</p>
                    <p><strong>Propriétaire:</strong> <span id="stationUser">-</span></p>
                    <button id="refreshBtn" class="btn btn-primary">Rafraîchir</button>
                </div>
            </div>
            <script>
                async function loadStationInfo() {
                try {
                    const res = await fetch('/api/localStationInfo');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const j = await res.json();
                    if (j.error) {
                    document.getElementById('stationVille').textContent = 'Aucune donnée';
                    return;
                    }
                    document.getElementById('stationVille').textContent = j.ville || 'Nom';
                    document.getElementById('stationCP').textContent = j.codepostal || '-';
                    document.getElementById('stationDesc').textContent = j.description || '-';
                    const user = j.user || {};
                    document.getElementById('stationUser').textContent = (user.prenom? (user.prenom+' ') : '') + (user.nom||'-');
                } catch (e) {
                    console.log('Erreur fetch localStationInfo', e);
                    document.getElementById('stationVille').textContent = 'Erreur de chargement';
                }
                }

                document.getElementById('refreshBtn').addEventListener('click', loadStationInfo);
                window.addEventListener('load', loadStationInfo);
            </script>
            </body>
    </container-fluid>
</html>
