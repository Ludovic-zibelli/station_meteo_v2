; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; platformio.ini — ESP32-WROOM-32D / WebServer synchrone / SPIFFS / ElegantOTA 3.x
[env:esp32-wroom-32d]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Choisis UN seul FS. Ici SPIFFS.
;board_build.filesystem = spiffs
board_build.filesystem = littlefs
; Si tu utilises un partitionnement custom, assure-toi que le chemin est valide
; Exemples :
; Utiliser un partitionnement compatible OTA + SPIFFS
board_build.partitions = partitions/huge_app.csv
; board_build.partitions = huge_app.csv

build_flags =
  -D CONFIG_FREERTOS_HZ=1000
  -D SQLITE_ENABLE_UPDATE_DELETE_LIMIT=1
  -Wno-error=discarded-qualifiers

lib_deps =
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit BusIO @ ^1.16.2
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  adafruit/DHT sensor library @ ^1.4.4
  bblanchon/ArduinoJson @ ^6.18.5
  https://github.com/siara-cc/esp32_arduino_sqlite3_lib
  ayushsharma82/ElegantOTA @ ^3.1.7
  adafruit/RTClib @ ^2.1.4
  https://github.com/adafruit/Adafruit_SHT4x.git
  adafruit/Adafruit Unified Sensor


[env:esp32ota]


platform   = ${env:esp32-wroom-32d.platform}
board      = ${env:esp32-wroom-32d.board}
framework  = ${env:esp32-wroom-32d.framework}

lib_deps   = ${env:esp32-wroom-32d.lib_deps}
build_flags= ${env:esp32-wroom-32d.build_flags}
board_build.filesystem  = ${env:esp32-wroom-32d.board_build.filesystem}
board_build.partitions  = ${env:esp32-wroom-32d.board_build.partitions}



upload_protocol = espota
upload_port     = 192.168.1.74
upload_flags    =
  --auth=OTA_MDP
  --port=3232
  --timeout=600
; build only the minimal OTA sketch to isolate OTA reliability

lib_ldf_mode = deep+
  

